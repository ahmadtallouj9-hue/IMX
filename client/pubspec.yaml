name: chatter
description: "Chatter — a modern real-time messaging app for Android and Windows."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP + WebSocket
  dio: ^5.4.3
  web_socket_channel: ^2.4.5
  socket_io_client: ^3.0.2

  # Persistence / secure storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # File picking
  image_picker: ^1.0.7

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

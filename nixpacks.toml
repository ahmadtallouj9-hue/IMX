# Belmo / Nixpacks — production-safe SPA + API build

[phases.setup]
nixPkgs = ["nodejs_20", "bash"]

[phases.install]
cmds = [
  "npm install --prefix web",
  "npm install --prefix server"
]

[phases.build]
cmds = [
  "npm run build --prefix web",
  "node scripts/copy-web-dist.mjs",
  "cd server && npx prisma generate && npx tsc"
]

[start]
cmd = "bash start.sh"
